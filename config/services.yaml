# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    _defaults:
        autowire: true
        autoconfigure: true
    _instanceof:
        App\Auth\Domain\Service\ProviderTokenValidatorInterface:
            tags: [ 'app.token_validator' ]

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            - '../src/*/Domain/Entity/'
            - '../src/*/Domain/ValueObject/'
            - '../src/*/Domain/Exception/'
            - '../src/Shared/Domain/ValueObject/'
            - '../src/Shared/Domain/Exception/'
            - '../src/*/Application/*/*Request.php'
            - '../src/*/Application/*/*Response.php'
            - '../src/UI/Http/Rest/Response/'
            - '../src/*/Infrastructure/Security/*Adapter.php'

    App\UI\Http\Rest\:
        resource: '../src/UI/Http/Rest/'
        tags: ['controller.service_arguments']

    App\UI\Http\Backoffice\:
        resource: '../src/UI/Http/Backoffice/'
        tags: ['controller.service_arguments']

    # Domain repository
    App\Auth\Domain\Repository\AuthUserRepositoryInterface:
        class: App\Auth\Infrastructure\Persistence\DoctrineAuthUserRepository

    # Domain services
    App\Auth\Application\SignIn\SignInHandlerInterface:
        alias: App\Auth\Application\SignIn\SignInHandler

    App\Auth\Domain\Service\ExternalTokenValidatorInterface:
        class: App\Auth\Infrastructure\Security\ChainExternalTokenValidator
        arguments:
            $validators: !tagged_iterator 'app.token_validator'

    App\Auth\Domain\Service\JwtTokenGeneratorInterface:
        class: App\Auth\Infrastructure\Jwt\LexikJwtTokenGenerator

    App\Auth\Domain\Service\PasswordHasherInterface:
        class: App\Auth\Infrastructure\Security\SymfonyPasswordHasher

    # Shared services
    App\Shared\Domain\Service\TransactionManagerInterface:
        alias: App\Shared\Infrastructure\Persistence\DoctrineTransactionManager

    App\Shared\Domain\Service\UuidGeneratorInterface:
        class: App\Shared\Infrastructure\Uid\SymfonyUuidGenerator

    # Security user provider (named alias for gesdinet config)
    app.auth_user_provider:
        alias: App\Auth\Infrastructure\Security\AuthUserProvider
        public: true

    App\Auth\Infrastructure\Security\GesdinetRefreshTokenIssuer:
        arguments:
            $refreshTokenTtl: '%env(int:JWT_REFRESH_TTL)%'

    # Profile repositories
    App\Profile\Domain\Repository\ProfileRepositoryInterface:
        class: App\Profile\Infrastructure\Persistence\DoctrineProfileRepository

    # Census repositories
    App\Census\Domain\Repository\CensusRepositoryInterface:
        class: App\Census\Infrastructure\Persistence\DoctrineCensusRepository

    # Observation repositories
    App\Observation\Domain\Repository\SessionRepositoryInterface:
        class: App\Observation\Infrastructure\Persistence\DoctrineSessionRepository

    App\Observation\Domain\Repository\ObservationRepositoryInterface:
        class: App\Observation\Infrastructure\Persistence\DoctrineObservationRepository

    App\Observation\Domain\Repository\SessionParticipantRepositoryInterface:
        class: App\Observation\Infrastructure\Persistence\DoctrineSessionParticipantRepository

    # BirdCatalog repositories
    App\BirdCatalog\Domain\Repository\BirdRepositoryInterface:
        class: App\BirdCatalog\Infrastructure\Persistence\DoctrineBirdRepository

    App\BirdCatalog\Domain\Repository\BirdCatalogVersionRepositoryInterface:
        class: App\BirdCatalog\Infrastructure\Persistence\DoctrineBirdCatalogVersionRepository

    #Uploaders
    App\BirdCatalog\Infrastructure\Service\BirdAudioUploader:
        arguments:
            $audiosDir: '/uploads/birds/audios'
            $publicDir: '%kernel.project_dir%/public'

    App\BirdCatalog\Infrastructure\Service\BirdImageUploader:
        arguments:
            $imagesDir: '/uploads/birds/images'
            $publicDir: '%kernel.project_dir%/public'


    # File Remover
    App\Shared\Application\Service\FileRemoverInterface:
        alias: App\Shared\Infrastructure\Service\LocalFileRemover
    App\Shared\Infrastructure\Service\LocalFileRemover:
        arguments:
            $publicDir: '%kernel.project_dir%/public'

    # Bird catalog handlers
    App\BirdCatalog\Application\CreateBird\CreateBirdHandler:
        arguments:
            $imageUploader: '@App\BirdCatalog\Infrastructure\Service\BirdImageUploader'
            $audioUploader: '@App\BirdCatalog\Infrastructure\Service\BirdAudioUploader'
    App\BirdCatalog\Application\UpdateBird\UpdateBirdHandler:
        arguments:
            $imageUploader: '@App\BirdCatalog\Infrastructure\Service\BirdImageUploader'
            $audioUploader: '@App\BirdCatalog\Infrastructure\Service\BirdAudioUploader'


