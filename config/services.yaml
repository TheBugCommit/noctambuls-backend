# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            - '../src/*/Domain/Entity/'
            - '../src/*/Domain/ValueObject/'
            - '../src/*/Domain/Exception/'
            - '../src/Shared/Domain/ValueObject/'
            - '../src/Shared/Domain/Exception/'
            - '../src/*/Application/*/*Request.php'
            - '../src/*/Application/*/*Response.php'
            - '../src/UI/Http/Rest/Response/'

    App\UI\Http\Rest\:
        resource: '../src/UI/Http/Rest/'
        tags: ['controller.service_arguments']

    App\Auth\Domain\Repository\AuthUserRepositoryInterface:
        class: App\Auth\Infrastructure\Persistence\DoctrineAuthUserRepository

    App\Auth\Domain\Service\ExternalTokenValidatorInterface:
        class: App\Auth\Infrastructure\Google\GoogleTokenValidator

    App\Auth\Domain\Service\JwtTokenGeneratorInterface:
        class: App\Auth\Infrastructure\Jwt\FirebaseJwtTokenGenerator
        arguments:
            $jwtSecret: '%env(JWT_SECRET)%'
            $ttl: '%env(int:JWT_TTL)%'

    App\Shared\Domain\Service\TransactionManagerInterface:
        alias: App\Shared\Infrastructure\Persistence\DoctrineTransactionManager
    App\Shared\Domain\Service\UuidGeneratorInterface:
        class: App\Shared\Infrastructure\Uid\SymfonyUuidGenerator
