services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\UI\Http\Rest\:
        resource: '../src/UI/Http/Rest/'
        tags: ['controller.service_arguments']
