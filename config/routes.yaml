# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

controllers:
    resource: routing.controllers

root_redirect:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: backoffice_login
        permanent: true

api_auth_signin:
    path: /api/auth/{provider}/signin
    controller: App\UI\Http\Rest\Auth\SocialSignInController
    methods: [POST]

api_auth_signup:
    path: /api/auth/{provider}/signup
    controller: App\UI\Http\Rest\Auth\SocialSignUpController
    methods: [POST]

api_refresh_token:
    path: /api/token/refresh
    methods: [POST]

api_profile_get:
    path: /api/profile/{id}
    controller: App\UI\Http\Rest\Profile\GetProfileController
    methods: [GET]

api_profile_edit:
    path: /api/profile/{id}
    controller: App\UI\Http\Rest\Profile\EditProfileController
    methods: [PATCH]

api_token_invalidate:
    path: /api/token/invalidate
    methods: [POST]

backoffice_login:
    path: /backoffice/login
    controller: App\UI\Http\Backoffice\Auth\BackofficeSignInController
    methods: [GET, POST]

backoffice_logout:
    path: /backoffice/logout
    methods: [GET]

api_bird_catalog:
    path: /api/catalog/birds
    controller: App\UI\Http\Rest\BirdCatalog\GetCatalogController
    methods: [GET]

api_bird_catalog_version:
    path: /api/catalog/birds/version
    controller: App\UI\Http\Rest\BirdCatalog\GetCatalogVersionController
    methods: [GET]

backoffice_bird_catalog_list:
    path: /backoffice/bird-catalog
    controller: App\UI\Http\Backoffice\BirdCatalog\BirdListController
    methods: [GET]

backoffice_bird_catalog_create:
    path: /backoffice/bird-catalog/create
    controller: App\UI\Http\Backoffice\BirdCatalog\BirdCreateController
    methods: [GET, POST]

backoffice_bird_catalog_edit:
    path: /backoffice/bird-catalog/{id}/edit
    controller: App\UI\Http\Backoffice\BirdCatalog\BirdEditController
    methods: [GET, POST]

backoffice_bird_catalog_delete:
    path: /backoffice/bird-catalog/{id}/delete
    controller: App\UI\Http\Backoffice\BirdCatalog\BirdDeleteController
    methods: [POST]

backoffice_users_list:
    path: /backoffice/users
    controller: App\UI\Http\Backoffice\UserManagement\AppUserListController
    methods: [GET]

backoffice_users_block:
    path: /backoffice/users/{id}/block
    controller: App\UI\Http\Backoffice\UserManagement\BlockUserController
    methods: [POST]

backoffice_users_unblock:
    path: /backoffice/users/{id}/unblock
    controller: App\UI\Http\Backoffice\UserManagement\UnblockUserController
    methods: [POST]

backoffice_users_delete:
    path: /backoffice/users/{id}/delete
    controller: App\UI\Http\Backoffice\UserManagement\DeleteAppUserController
    methods: [POST]

backoffice_backoffice_users_list:
    path: /backoffice/backoffice-users
    controller: App\UI\Http\Backoffice\UserManagement\BackofficeUserListController
    methods: [GET]

backoffice_backoffice_users_create:
    path: /backoffice/backoffice-users/create
    controller: App\UI\Http\Backoffice\UserManagement\CreateBackofficeUserController
    methods: [GET, POST]

backoffice_backoffice_users_edit:
    path: /backoffice/backoffice-users/{id}/edit
    controller: App\UI\Http\Backoffice\UserManagement\EditBackofficeUserController
    methods: [GET, POST]

backoffice_backoffice_users_delete:
    path: /backoffice/backoffice-users/{id}/delete
    controller: App\UI\Http\Backoffice\UserManagement\DeleteBackofficeUserController
    methods: [POST]

api_user_self_delete:
    path: /api/user/account
    controller: App\UI\Http\Rest\Auth\SelfDeleteAccountController
    methods: [DELETE]

backoffice_census_list:
    path: /backoffice/censuses
    controller: App\UI\Http\Backoffice\Census\CensusListController
    methods: [GET]

backoffice_census_create:
    path: /backoffice/censuses/create
    controller: App\UI\Http\Backoffice\Census\CensusCreateController
    methods: [GET, POST]

backoffice_census_edit:
    path: /backoffice/censuses/{id}/edit
    controller: App\UI\Http\Backoffice\Census\CensusEditController
    methods: [GET, POST]

backoffice_census_delete:
    path: /backoffice/censuses/{id}/delete
    controller: App\UI\Http\Backoffice\Census\CensusDeleteController
    methods: [POST]

backoffice_census_publish:
    path: /backoffice/censuses/{id}/publish
    controller: App\UI\Http\Backoffice\Census\CensusPublishController
    methods: [POST]

api_sync_up:
    path: /api/sync/observations
    controller: App\UI\Http\Rest\Observation\SyncUpController
    methods: [POST]

api_observation_history:
    path: /api/observations/history
    controller: App\UI\Http\Rest\Observation\ObservationHistoryController
    methods: [GET]

api_sessions_participated:
    path: /api/sessions/participated
    controller: App\UI\Http\Rest\Observation\ParticipatedSessionsController
    methods: [GET]

backoffice_session_list:
    path: /backoffice/sessions
    controller: App\UI\Http\Backoffice\Observation\SessionListController
    methods: [GET]

backoffice_session_trash:
    path: /backoffice/sessions/trash
    controller: App\UI\Http\Backoffice\Observation\SessionTrashController
    methods: [GET]

backoffice_session_trash_purge:
    path: /backoffice/sessions/trash/purge
    controller: App\UI\Http\Backoffice\Observation\SessionTrashPurgeController
    methods: [POST]

backoffice_session_detail:
    path: /backoffice/sessions/{id}
    controller: App\UI\Http\Backoffice\Observation\SessionDetailController
    methods: [GET, POST]

backoffice_session_delete:
    path: /backoffice/sessions/{id}/delete
    controller: App\UI\Http\Backoffice\Observation\SessionDeleteController
    methods: [POST]

backoffice_session_restore:
    path: /backoffice/sessions/{id}/restore
    controller: App\UI\Http\Backoffice\Observation\SessionRestoreController
    methods: [POST]

backoffice_observation_detail:
    path: /backoffice/observations/{id}
    controller: App\UI\Http\Backoffice\Observation\ObservationDetailController
    methods: [GET, POST]
