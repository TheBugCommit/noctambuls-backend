security:
    password_hashers:
        App\Auth\Infrastructure\Security\AuthUserSymfonyAdapter:
            algorithm: bcrypt

    providers:
        auth_user_provider:
            id: App\Auth\Infrastructure\Security\AuthUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        cron_api:
            pattern: ^/api/internal
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: auth_user_provider
            user_checker: App\Auth\Infrastructure\Security\BlockedUserChecker
            entry_point: jwt
            jwt: ~
            refresh_jwt:
                check_path: /api/token/refresh
            logout:
                path: api_token_invalidate

        main:
            pattern: ^/
            provider: auth_user_provider
            user_checker: App\Auth\Infrastructure\Security\BlockedUserChecker
            lazy: true
            form_login:
                login_path: backoffice_login
                check_path: backoffice_login
                default_target_path: backoffice_session_list
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: backoffice_logout
                target: backoffice_login

    role_hierarchy:
        ROLE_REVIEWER: [ROLE_USER]
        ROLE_ADMIN: [ROLE_REVIEWER]

    access_control:
        - { path: ^/api/internal, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/backoffice/login, roles: PUBLIC_ACCESS }
        - { path: ^/backoffice/logout, roles: ROLE_REVIEWER }
        - { path: ^/backoffice/sessions, roles: ROLE_REVIEWER }
        - { path: ^/backoffice/observations, roles: ROLE_REVIEWER }
        - { path: ^/backoffice, roles: ROLE_ADMIN }
        - { path: ^/privacity-policy, roles: PUBLIC_ACCESS }
        - { path: ^/terms-and-conditions, roles: PUBLIC_ACCESS }
        - { path: ^/help, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            App\Auth\Infrastructure\Security\AuthUserSymfonyAdapter:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
